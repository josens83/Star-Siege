<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4488ff"/>
      <stop offset="100%" style="stop-color:#44ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#4488ff" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#44ff88" stroke-width="4" opacity="0.2"/>

  <!-- Star/Crystal shape -->
  <g filter="url(#glow)">
    <path d="M256 80 L300 200 L420 200 L320 280 L360 400 L256 320 L152 400 L192 280 L92 200 L212 200 Z"
          fill="url(#star)"
          opacity="0.9"/>
  </g>

  <!-- Center highlight -->
  <circle cx="256" cy="256" r="40" fill="#ffffff" opacity="0.3"/>
  <circle cx="240" cy="240" r="15" fill="#ffffff" opacity="0.5"/>

  <!-- Swords crossed -->
  <g stroke="#ff8844" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="380" x2="280" y2="250"/>
    <line x1="362" y1="380" x2="232" y2="250"/>
  </g>

  <!-- Sword handles -->
  <circle cx="150" cy="380" r="15" fill="#ff8844" opacity="0.7"/>
  <circle cx="362" cy="380" r="15" fill="#ff8844" opacity="0.7"/>
</svg>
