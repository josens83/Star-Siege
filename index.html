<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4488ff">
    <meta name="description" content="Star Siege - 모바일 실시간 전략 게임">

    <title>Star Siege</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 메인 게임 컨테이너 -->
    <div id="game-container">
        <!-- 게임 캔버스 -->
        <canvas id="game-canvas"></canvas>

        <!-- UI 오버레이 -->
        <div id="ui-overlay">
            <!-- 상단 자원 HUD -->
            <div id="resource-hud">
                <div class="resource-item" id="crystal-display">
                    <span class="resource-icon">💎</span>
                    <span class="resource-value" id="crystal-value">100</span>
                    <span class="resource-rate" id="crystal-rate">+0/s</span>
                </div>
                <div class="resource-item" id="energy-display">
                    <span class="resource-icon">⚡</span>
                    <span class="resource-value" id="energy-value">50</span>
                    <span class="resource-rate" id="energy-rate">+0/s</span>
                </div>
                <div id="population-display">
                    <span class="population-icon">👥</span>
                    <span id="population-value">0/10</span>
                </div>
            </div>

            <!-- 우측 상단 미니맵 -->
            <div id="minimap-container">
                <canvas id="minimap-canvas"></canvas>
            </div>

            <!-- 메뉴 버튼 -->
            <button id="menu-button" class="ui-button">☰</button>

            <!-- 좌측 하단 가상 조이스틱 -->
            <div id="joystick-container">
                <div id="joystick-base">
                    <div id="joystick-thumb"></div>
                </div>
            </div>

            <!-- 하단 건설 메뉴 버튼 -->
            <div id="build-menu-toggle">
                <button id="build-button" class="ui-button">🏗️ 건설</button>
            </div>

            <!-- 건설 메뉴 패널 -->
            <div id="build-menu" class="hidden">
                <div id="build-menu-header">
                    <span>건설 메뉴</span>
                    <button id="build-menu-close" class="close-button">✕</button>
                </div>
                <div id="build-menu-tabs">
                    <button class="tab-button active" data-tab="buildings">건물</button>
                    <button class="tab-button" data-tab="units">유닛</button>
                </div>
                <div id="build-menu-content">
                    <div id="buildings-tab" class="tab-content active"></div>
                    <div id="units-tab" class="tab-content"></div>
                </div>
            </div>

            <!-- 우측 하단 명령 패널 -->
            <div id="command-panel" class="hidden">
                <div id="unit-portrait">
                    <div id="portrait-icon"></div>
                    <div id="portrait-info">
                        <span id="portrait-name"></span>
                        <div id="portrait-health">
                            <div id="health-bar"></div>
                            <span id="health-text"></span>
                        </div>
                        <div id="portrait-shield" class="hidden">
                            <div id="shield-bar"></div>
                            <span id="shield-text"></span>
                        </div>
                    </div>
                </div>
                <div id="command-buttons">
                    <button class="command-btn" id="cmd-move" title="이동">🚶</button>
                    <button class="command-btn" id="cmd-attack" title="공격">⚔️</button>
                    <button class="command-btn" id="cmd-stop" title="정지">🛑</button>
                    <button class="command-btn" id="cmd-hold" title="위치 고수">🛡️</button>
                </div>
                <div id="production-queue" class="hidden">
                    <div id="queue-items"></div>
                    <div id="production-progress">
                        <div id="progress-bar"></div>
                        <span id="progress-text"></span>
                    </div>
                </div>
            </div>

            <!-- 토스트 알림 -->
            <div id="toast-container"></div>

            <!-- 웨이브 인디케이터 -->
            <div id="wave-indicator" class="hidden">
                <span id="wave-number">웨이브 1</span>
                <span id="wave-timer"></span>
            </div>

            <!-- 목표 패널 -->
            <div id="objective-panel" class="hidden">
                <div id="objective-title">목표</div>
                <div id="objective-list"></div>
            </div>
        </div>

        <!-- 메뉴 오버레이 -->
        <div id="menu-overlay" class="overlay hidden">
            <div class="overlay-content">
                <h1>⚔️ Star Siege ⚔️</h1>
                <div id="main-menu">
                    <button class="menu-btn" id="btn-new-game">새 게임</button>
                    <button class="menu-btn" id="btn-continue" disabled>계속하기</button>
                    <button class="menu-btn" id="btn-tutorial">튜토리얼</button>
                    <button class="menu-btn" id="btn-settings">설정</button>
                </div>

                <div id="game-mode-select" class="hidden">
                    <h2>게임 모드 선택</h2>
                    <button class="menu-btn" data-mode="skirmish">⚔️ 스커미시</button>
                    <button class="menu-btn" data-mode="wave">🌊 웨이브 모드</button>
                    <button class="menu-btn" data-mode="campaign">📜 캠페인</button>
                    <button class="menu-btn back-btn" id="btn-back-main">← 뒤로</button>
                </div>

                <div id="faction-select" class="hidden">
                    <h2>진영 선택</h2>
                    <div class="faction-cards">
                        <div class="faction-card" data-faction="terra">
                            <div class="faction-icon" style="background-color: #4488ff;">🏛️</div>
                            <h3>테라 연합</h3>
                            <p>균형잡힌 올라운더<br>다재다능한 유닛 구성</p>
                        </div>
                        <div class="faction-card" data-faction="kryon">
                            <div class="faction-icon" style="background-color: #44ff88;">💠</div>
                            <h3>크리온</h3>
                            <p>빠르고 기동성 높음<br>쉴드 재생 능력</p>
                        </div>
                        <div class="faction-card" data-faction="mechanicus">
                            <div class="faction-icon" style="background-color: #ff8844;">⚙️</div>
                            <h3>메카니쿠스</h3>
                            <p>느리지만 강력함<br>높은 방어력</p>
                        </div>
                    </div>
                    <button class="menu-btn back-btn" id="btn-back-mode">← 뒤로</button>
                </div>

                <div id="difficulty-select" class="hidden">
                    <h2>난이도 선택</h2>
                    <button class="menu-btn" data-difficulty="easy">😊 쉬움</button>
                    <button class="menu-btn" data-difficulty="normal">😐 보통</button>
                    <button class="menu-btn" data-difficulty="hard">😈 어려움</button>
                    <button class="menu-btn back-btn" id="btn-back-faction">← 뒤로</button>
                </div>

                <div id="settings-menu" class="hidden">
                    <h2>설정</h2>
                    <div class="setting-item">
                        <label>배경음악</label>
                        <input type="range" id="bgm-volume" min="0" max="100" value="50">
                        <span id="bgm-value">50%</span>
                    </div>
                    <div class="setting-item">
                        <label>효과음</label>
                        <input type="range" id="sfx-volume" min="0" max="100" value="70">
                        <span id="sfx-value">70%</span>
                    </div>
                    <div class="setting-item">
                        <label>가상 조이스틱</label>
                        <input type="checkbox" id="joystick-enabled" checked>
                    </div>
                    <div class="setting-item">
                        <label>파티클 효과</label>
                        <input type="checkbox" id="particles-enabled" checked>
                    </div>
                    <button class="menu-btn back-btn" id="btn-back-settings">← 뒤로</button>
                </div>

                <div id="pause-menu" class="hidden">
                    <h2>일시정지</h2>
                    <button class="menu-btn" id="btn-resume">계속하기</button>
                    <button class="menu-btn" id="btn-save">저장하기</button>
                    <button class="menu-btn" id="btn-load">불러오기</button>
                    <button class="menu-btn" id="btn-quit">메인 메뉴로</button>
                </div>

                <div id="game-over-screen" class="hidden">
                    <h2 id="game-result"></h2>
                    <div id="game-stats">
                        <p>플레이 시간: <span id="stat-time">00:00</span></p>
                        <p>유닛 생산: <span id="stat-units">0</span></p>
                        <p>적 처치: <span id="stat-kills">0</span></p>
                        <p>건물 건설: <span id="stat-buildings">0</span></p>
                    </div>
                    <button class="menu-btn" id="btn-play-again">다시 하기</button>
                    <button class="menu-btn" id="btn-to-main">메인 메뉴</button>
                </div>
            </div>
        </div>

        <!-- 로딩 화면 -->
        <div id="loading-screen">
            <div class="loading-content">
                <h1>⚔️ Star Siege ⚔️</h1>
                <div class="loading-bar">
                    <div class="loading-progress" id="loading-progress"></div>
                </div>
                <p id="loading-text">로딩 중...</p>
            </div>
        </div>

        <!-- 튜토리얼 오버레이 -->
        <div id="tutorial-overlay" class="hidden">
            <div id="tutorial-highlight"></div>
            <div id="tutorial-message">
                <p id="tutorial-text"></p>
                <div id="tutorial-buttons">
                    <button id="tutorial-skip">건너뛰기</button>
                    <button id="tutorial-next">다음</button>
                </div>
            </div>
            <div id="tutorial-finger" class="hidden">👆</div>
        </div>
    </div>

    <!-- JavaScript 모듈 로드 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
