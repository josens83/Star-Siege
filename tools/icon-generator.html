<!DOCTYPE html>
<html>
<head>
    <title>Star Siege Icon Generator</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; }
        canvas { border: 1px solid #444; margin: 5px; }
        .icons { display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Star Siege 아이콘 생성기</h1>
    <p>아래 버튼을 클릭하여 각 크기의 아이콘을 다운로드하세요.</p>
    <div class="icons" id="icons"></div>
    <button onclick="downloadAll()">모든 아이콘 다운로드</button>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const s = size;

            // 배경
            const bgGrad = ctx.createLinearGradient(0, 0, s, s);
            bgGrad.addColorStop(0, '#0a0a1a');
            bgGrad.addColorStop(1, '#1a1a2e');

            // 둥근 사각형 배경
            ctx.fillStyle = bgGrad;
            roundRect(ctx, 0, 0, s, s, s * 0.15);
            ctx.fill();

            // 외곽 링
            ctx.strokeStyle = 'rgba(68, 136, 255, 0.3)';
            ctx.lineWidth = s * 0.015;
            ctx.beginPath();
            ctx.arc(s/2, s/2, s * 0.39, 0, Math.PI * 2);
            ctx.stroke();

            // 별 모양
            const starGrad = ctx.createLinearGradient(0, 0, s, s);
            starGrad.addColorStop(0, '#4488ff');
            starGrad.addColorStop(1, '#44ff88');

            ctx.fillStyle = starGrad;
            ctx.shadowColor = '#4488ff';
            ctx.shadowBlur = s * 0.05;
            drawStar(ctx, s/2, s/2, 5, s * 0.35, s * 0.17);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 중앙 하이라이트
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(s/2, s/2, s * 0.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(s * 0.47, s * 0.47, s * 0.03, 0, Math.PI * 2);
            ctx.fill();

            // 교차된 검
            ctx.strokeStyle = '#ff8844';
            ctx.lineWidth = s * 0.02;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(s * 0.29, s * 0.74);
            ctx.lineTo(s * 0.55, s * 0.49);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(s * 0.71, s * 0.74);
            ctx.lineTo(s * 0.45, s * 0.49);
            ctx.stroke();

            // 검 손잡이
            ctx.fillStyle = '#ff8844';
            ctx.beginPath();
            ctx.arc(s * 0.29, s * 0.74, s * 0.03, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.71, s * 0.74, s * 0.03, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            const step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);

            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }

            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        function createIcons() {
            const container = document.getElementById('icons');

            sizes.forEach(size => {
                const div = document.createElement('div');
                div.style.textAlign = 'center';

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `icon-${size}`;
                drawIcon(canvas, size);

                const label = document.createElement('div');
                label.textContent = `${size}x${size}`;

                const btn = document.createElement('button');
                btn.textContent = '다운로드';
                btn.onclick = () => downloadIcon(size);

                div.appendChild(canvas);
                div.appendChild(label);
                div.appendChild(btn);
                container.appendChild(div);
            });
        }

        function downloadIcon(size) {
            const canvas = document.getElementById(`icon-${size}`);
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            sizes.forEach((size, i) => {
                setTimeout(() => downloadIcon(size), i * 200);
            });
        }

        createIcons();
    </script>
</body>
</html>
